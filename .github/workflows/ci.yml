name: CI - OdontoPro Paraguay

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript typecheck (lint)
        run: npm run lint

      - name: Run automated test suite
        run: npm test

      - name: Verify SQL migrations structure
        run: npm run db:migrate -- --status --if-configured

      - name: Build production frontend bundle
        run: npm run build

      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
