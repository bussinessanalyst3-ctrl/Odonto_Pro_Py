name: CI/CD Pipeline - Producción Vercel (OdontoPro Paraguay)

on:
  push:
    branches: [main, master, staging]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-test:
    name: Lint, Typecheck & Testing Automatizado
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm install --legacy-peer-deps

      - name: Verificación de Tipos TypeScript & Linter
        run: npm run lint

      - name: Compilación de Prueba Vite para Producción
        run: npm run build
        env:
          NODE_ENV: production

  deploy-to-vercel:
    name: Despliegue Automatizado a Vercel
    needs: validate-and-test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Desplegar a Vercel Producción
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          scope: ${{ secrets.VERCEL_SCOPE }}
